name: package_info_plus_sailfish
description: Sailfish OS implementation of package_info_plus. The app's name and id come from its desktop file, its version from the build.
version: 0.1.0
# Not published yet.
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  package_info_plus_platform_interface: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

# flutter-elinux registers elinux Dart plugins after Flutter registers the
# Linux ones, so on Sailfish OS this replaces package_info_plus's Linux
# version.
flutter:
  plugin:
    implements: package_info_plus
    platforms:
      elinux:
        dartPluginClass: PackageInfoPlusSailfish
