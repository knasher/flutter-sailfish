name: shared_preferences_sailfish
description: Sailfish OS implementation of shared_preferences. Preferences are kept in the app's Sailjail data folder.
version: 0.1.0
# Not published yet.
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider_linux: ^2.2.0
  path_provider_sailfish:
    path: ../path_provider_sailfish
  shared_preferences_linux: ^2.4.0
  shared_preferences_platform_interface: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

# flutter-elinux registers elinux Dart plugins after Flutter registers the
# Linux ones, so on Sailfish OS this replaces shared_preferences_linux.
flutter:
  plugin:
    implements: shared_preferences
    platforms:
      elinux:
        dartPluginClass: SharedPreferencesSailfish
