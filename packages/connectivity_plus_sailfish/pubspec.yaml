name: connectivity_plus_sailfish
description: Sailfish OS implementation of connectivity_plus. Asks ConnMan, Sailfish OS's network manager.
version: 0.1.0
# Not published yet.
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  connectivity_plus_platform_interface: ^2.0.1
  # 0.8 only added things (anonymous auth, records in generated code).
  dbus: ">=0.7.11 <0.9.0"
  flutter:
    sdk: flutter

dev_dependencies:
  async: ^2.11.0
  flutter_test:
    sdk: flutter

# flutter-elinux registers elinux Dart plugins after Flutter registers the
# Linux ones, so on Sailfish OS this replaces connectivity_plus's Linux
# version.
flutter:
  plugin:
    implements: connectivity_plus
    platforms:
      elinux:
        dartPluginClass: ConnectivityPlusSailfish
