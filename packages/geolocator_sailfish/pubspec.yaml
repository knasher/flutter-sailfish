name: geolocator_sailfish
description: Sailfish OS implementation of geolocator. Positions come from GeoClue, Sailfish OS's location service.
version: 0.1.0
# Not published yet.
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  dbus: ^0.7.11
  flutter:
    sdk: flutter
  geolocator_platform_interface: ^4.2.8

dev_dependencies:
  async: ^2.11.0
  flutter_test:
    sdk: flutter

# flutter-elinux registers elinux Dart plugins after Flutter registers the
# Linux ones, so on Sailfish OS this replaces geolocator_linux.
flutter:
  plugin:
    implements: geolocator
    platforms:
      elinux:
        dartPluginClass: GeolocatorSailfish
