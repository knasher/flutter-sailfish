name: flutter_secure_storage_sailfish
description: Sailfish OS implementation of flutter_secure_storage. Values are kept in a private file in the app's Sailjail data folder (not encrypted).
version: 0.1.0
# Not published yet.
publish_to: none

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage_platform_interface: ^2.0.1
  path_provider_sailfish:
    path: ../path_provider_sailfish

dev_dependencies:
  flutter_test:
    sdk: flutter

# flutter-elinux registers elinux Dart plugins after Flutter registers the
# Linux ones, so on Sailfish OS this replaces flutter_secure_storage_linux.
flutter:
  plugin:
    implements: flutter_secure_storage
    platforms:
      elinux:
        dartPluginClass: FlutterSecureStorageSailfish
